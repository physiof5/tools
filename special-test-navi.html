<!DOCTYPE html>
<!-- 스페셜 테스트 내비 v3 · MVP 공개판 (2026-09)
  [홈 화면 앱] special-test-navi-manifest.json · special-test-navi-sw.js · special-test-navi-icon-*.png 를 같은 폴더에 함께 올려야 합니다.
   - 안드로이드 크롬 「앱 설치/홈 화면에 추가」, 아이폰 Safari 「홈 화면에 추가」 시 노란 T 아이콘으로 표시
   - 주소 끝의 .html 유무와 관계없이 설치됩니다(Netlify 등). 이름·범위·캐시가 모두 이 도구 전용이라 같은 사이트의 다른 도구(임상 추론 파트너 등)와 겹치지 않습니다
   - 한 번 열어 두면 인터넷이 끊겨도 마지막으로 받은 화면이 열립니다 (전자책 영상 링크는 인터넷 필요)
  [공유 미리보기] special-test-navi-og.png — 카카오톡·문자로 주소를 보낼 때 뜨는 그림 (https://physiof5.netlify.app/special-test-navi.html 기준)
  [탭 아이콘] special-test-navi-icon.svg — T 아이콘 원본(수정용)
  [v3 내용]
  · 부위 → 증상 분류 → 근거 기반 검사 순서 (SnNout 선별 → SpPin 확인)
  · 양성/음성 입력 → 우도비(LR)로 사후확률 갱신, 검증된 클러스터는 클러스터 LR 우선
  · 검사별 양성 기준(원 연구 판정 기준)과 전자책 영상 연결
  · 정확도 연구(민감도·특이도 또는 우도비)가 없는 검사는 수록하지 않음
  · 수치 출처: 각 분류의 '근거' 버튼 / 사이드바 '전체 근거표' -->

<meta name="theme-color" content="#101826">

<style>
:root{
  --navy-950:#101826;
  --navy-900:#16202f;
  --navy-800:#1d2a3d;
  --navy-700:#27374e;
  --navy-600:#33465f;
  --line:#2c3c52;
  --ink:#eaf0f8;
  --ink-dim:#9fb0c5;
  --ink-faint:#66788f;
  --paper:#f7f8fa;
  --paper-card:#ffffff;
  --paper-line:#e4e8ee;
  --text:#1b2534;
  --text-dim:#5a6a80;
  --text-faint:#8795a8;
  --yellow:#ffd44d;
  --yellow-deep:#f5b800;
  --yellow-ink:#3d2f00;
  --yellow-soft:#fff6d6;
  --red:#e5484d;
  --red-soft:#fdeced;
  --red-ink:#a3262b;
  --orange:#e8862c;
  --orange-soft:#fff1e2;
  --orange-ink:#94500f;
  --green:#2f9e6e;
  --green-soft:#e3f5ec;
  --green-ink:#1d6b48;
  --teal:#3c8fa3;
  --slate-soft:#eef1f5;
  --radius:14px;
  --radius-sm:9px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--navy-950);color:var(--ink);
  font-size:15px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit}
::selection{background:var(--yellow);color:var(--yellow-ink)}
:focus-visible{outline:2px solid var(--yellow-deep);outline-offset:2px}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ============ 좌측 패널 ============ */
#side{
  width:320px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--navy-950);border-right:1px solid var(--line);
  overflow-y:auto;color-scheme:dark;
}
#side::-webkit-scrollbar{width:5px}
#side::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:3px}
.side-head{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;cursor:pointer}
.brand-mark{width:12px;height:12px;background:var(--yellow);flex-shrink:0;transform:translateY(-1px)}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand-sub{margin-top:6px;font-size:12px;color:var(--ink-faint);padding-left:20px}

.side-sec-title{font-size:11px;font-weight:800;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:9px}
.side-regions{padding:16px 22px 14px;border-bottom:1px solid var(--line)}
.rg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rg-btn{
  text-align:left;padding:8px 11px;border-radius:8px;
  background:var(--navy-800);border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--ink-dim);transition:all .12s;
  display:flex;justify-content:space-between;align-items:center;gap:6px;
}
.rg-btn:hover{border-color:var(--ink-faint);color:var(--ink)}
.rg-btn.on{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.rg-btn .rg-dot{width:6px;height:6px;border-radius:50%;background:var(--yellow);flex-shrink:0}
.rg-btn.on .rg-dot{background:var(--yellow-ink)}

.side-cats{flex:1;padding:14px 12px 18px}
.sc-group{margin-bottom:12px}
.sc-gname{font-size:11px;font-weight:800;color:var(--ink-faint);letter-spacing:.04em;padding:0 10px;margin-bottom:4px}
.sc-item{
  width:100%;text-align:left;padding:8px 10px 9px;border-radius:var(--radius-sm);
  display:flex;gap:10px;align-items:flex-start;transition:background .12s;position:relative;
}
.sc-item:hover{background:var(--navy-800)}
.sc-item.on{background:var(--navy-800)}
.sc-item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--yellow)}
.sc-text{flex:1;min-width:0}
.sc-name{display:block;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.4}
.sc-cue{display:block;font-size:11.5px;color:var(--ink-faint);line-height:1.45;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-red{color:#ff9296;font-weight:800;font-size:11px;margin-left:4px}
.pbadge{
  flex-shrink:0;font-size:11px;font-weight:800;padding:2px 7px;border-radius:100px;margin-top:1px;
  background:var(--navy-700);color:var(--ink-dim);font-variant-numeric:tabular-nums;
}
.pbadge.z-out{background:rgba(47,158,110,.2);color:#6fd3a3}
.pbadge.z-low{background:rgba(60,143,163,.2);color:#8fd0de}
.pbadge.z-mid{background:var(--navy-700);color:var(--ink-dim)}
.pbadge.z-high{background:rgba(232,134,44,.2);color:#f0a860}
.pbadge.z-in{background:rgba(229,72,77,.22);color:#ff9296}

.side-foot{padding:12px 22px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sf-row{display:flex;gap:6px}
.sf-btn{
  flex:1;font-size:12px;font-weight:700;color:var(--ink-dim);padding:8px 6px;border-radius:8px;
  border:1px solid var(--line);background:var(--navy-900);transition:all .12s;
}
.sf-btn:hover{color:var(--ink);border-color:var(--ink-faint)}
.sf-btn.armed,.sf-btn.armed:hover{color:var(--yellow-ink);background:var(--yellow);border-color:var(--yellow)}
.sf-note{font-size:11px;color:var(--ink-faint);line-height:1.5;margin-top:4px}

/* ============ 우측 본문 ============ */
#mainCol{flex:1;display:flex;flex-direction:column;background:var(--paper);color:var(--text);min-width:0}
.top{
  height:58px;flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 22px;background:var(--paper-card);border-bottom:1px solid var(--paper-line);
}
.top-titles{min-width:0;flex:1}
.top-title{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.top-sub{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.tbtn{
  display:flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:700;color:var(--text-dim);
  padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--paper-line);
  background:var(--paper-card);transition:all .12s;white-space:nowrap;
}
.tbtn:hover{color:var(--text);border-color:#c9d2de}
.tbtn svg{width:14px;height:14px;flex-shrink:0}
.tbtn.icon{padding:7px 9px}
#backBtn{display:none}
#mobileToggle{display:none}

#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
#inner{max-width:760px;margin:0 auto;padding:26px 26px 60px}

/* 공통 카드 */
.card{background:var(--paper-card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.card-label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--text-dim);letter-spacing:.04em;margin-bottom:10px}
.card-label::before{content:"";width:8px;height:8px;background:var(--yellow)}
.card-label .cl-right{margin-left:auto;font-weight:600;letter-spacing:0;color:var(--text-faint);font-size:11.5px}

/* 홈 */
.home-hero{padding:4px 2px 6px}
.home-hero .e-mark{width:34px;height:6px;background:var(--yellow);margin-bottom:18px}
.home-hero h2{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.32;margin-bottom:10px}
.home-hero p{font-size:14.5px;color:var(--text-dim);margin-bottom:20px}
.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.rule{border-radius:var(--radius);padding:16px 17px;border:1px solid var(--paper-line);background:var(--paper-card)}
.rule-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:5px;margin-bottom:9px}
.rule.out .rule-tag{background:var(--green-soft);color:var(--green-ink)}
.rule.in .rule-tag{background:var(--orange-soft);color:var(--orange-ink)}
.rule h3{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.rule p{font-size:13px;color:var(--text-dim);line-height:1.55}
.rule b{color:var(--text)}
.home-sec{font-size:12px;font-weight:800;color:var(--text-dim);letter-spacing:.05em;margin:4px 0 10px}
.region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.region-card{
  text-align:left;background:var(--paper-card);border:1px solid var(--paper-line);border-radius:12px;
  padding:13px 14px;transition:all .12s;
}
.region-card:hover{border-color:var(--navy-900);transform:translateY(-1px)}
.region-card .rc-n{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.region-card .rc-en{display:block;font-size:11px;color:var(--text-faint);margin-top:1px}
.region-card .rc-c{display:block;font-size:11.5px;color:var(--text-dim);margin-top:8px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step-num{
  width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--navy-900);color:var(--yellow);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.step div{font-size:14px;padding-top:1px}
.step span{color:var(--text-dim)}

/* 부위 화면 */
.region-head{margin:2px 2px 16px}
.region-head h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
.region-head p{font-size:13.5px;color:var(--text-dim);margin-top:3px}
.grp{margin-bottom:18px}
.grp-name{font-size:12px;font-weight:800;color:var(--text-dim);letter-spacing:.04em;margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.grp-name::after{content:"";flex:1;height:1px;background:var(--paper-line)}
.cat-card{
  width:100%;text-align:left;display:flex;gap:14px;align-items:center;
  background:var(--paper-card);border:1px solid var(--paper-line);border-radius:12px;
  padding:13px 16px;margin-bottom:8px;transition:all .12s;
}
.cat-card:hover{border-color:var(--navy-900)}
.cat-card .cc-main{flex:1;min-width:0}
.cat-card .cc-n{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.cat-card .cc-en{font-size:11.5px;color:var(--text-faint);font-weight:600;margin-left:6px}
.cat-card .cc-cue{display:block;font-size:12.5px;color:var(--text-dim);margin-top:3px;line-height:1.5}
.cat-card .cc-n .redtag{font-size:10.5px;font-weight:800;color:var(--red-ink);background:var(--red-soft);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.cat-card .cc-arrow{color:#b6c1cf;flex-shrink:0}
.cat-card .pbadge{background:var(--slate-soft);color:var(--text-dim)}
.cat-card .pbadge.z-out{background:var(--green-soft);color:var(--green-ink)}
.cat-card .pbadge.z-low{background:#e3f2f6;color:#23687a}
.cat-card .pbadge.z-high{background:var(--orange-soft);color:var(--orange-ink)}
.cat-card .pbadge.z-in{background:var(--red-soft);color:var(--red-ink)}

/* 세션 헤더 */
.s-cue{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text-dim);line-height:1.55}
.s-cue .ic{flex-shrink:0;width:18px;height:18px;margin-top:1px;color:var(--text-faint)}
.pre-row{display:flex;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap}
.pre-lab{font-size:12.5px;font-weight:800;color:var(--text)}
.pre-lab small{display:block;font-size:11px;font-weight:600;color:var(--text-faint)}
.seg{display:flex;background:var(--slate-soft);border-radius:9px;padding:3px;gap:3px;margin-left:auto}
.seg button{
  padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--text-dim);transition:all .12s;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.seg button.on{background:var(--navy-900);color:var(--yellow)}

/* 확률 카드 */
.prob{padding:18px 20px 16px}
.prob-top{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.prob-num{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.prob-lab{font-size:14px;font-weight:800;padding:4px 10px;border-radius:7px;margin-bottom:3px}
.prob-top .pt-right{margin-left:auto;text-align:right;font-size:12px;color:var(--text-dim);line-height:1.5}
.prob-top .pt-right b{color:var(--text);font-variant-numeric:tabular-nums}
.z-none{background:var(--slate-soft);color:var(--text-dim)}
.z-out{background:var(--green-soft);color:var(--green-ink)}
.z-low{background:#e3f2f6;color:#23687a}
.z-mid{background:var(--slate-soft);color:var(--text-dim)}
.z-high{background:var(--orange-soft);color:var(--orange-ink)}
.z-in{background:var(--red-soft);color:var(--red-ink)}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--slate-soft);overflow:visible;margin:4px 0 6px}
.g-zone{position:absolute;top:0;bottom:0}
.g-out{left:0;background:#bfe6d2;border-radius:6px 0 0 6px}
.g-in{right:0;background:#f7c7c9;border-radius:0 6px 6px 0}
.g-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,rgba(22,32,47,.10),rgba(22,32,47,.22));transition:width .35s ease}
.g-needle{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;border-radius:2px;background:var(--navy-900);transition:left .35s ease;box-shadow:0 0 0 2px #fff}
.g-pre{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid var(--navy-900);background:#fff;opacity:.55}
.g-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.prob-msg{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:13.5px;line-height:1.55;display:flex;gap:9px;align-items:flex-start}
.prob-msg b{font-weight:800}
.prob-msg .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:7px;background:currentColor}

/* 다음 검사 */
.next{border:2px solid var(--yellow-deep);background:#fffdf5;padding:16px 18px}
.next.stop{border-color:var(--paper-line);background:var(--paper-card)}
.next-name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.next-name .k{font-size:13px;font-weight:600;color:var(--text-dim);margin-left:6px}
.next-why{font-size:13px;color:var(--text-dim);margin-top:4px}
.next-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--text-dim)}
.next-meta b{color:var(--text);font-variant-numeric:tabular-nums}
.next .pn{margin-top:13px}
.next-tip{margin-top:9px;font-size:12px;color:var(--orange-ink);background:var(--orange-soft);border-radius:7px;padding:6px 10px}
.stop-note{font-size:13px;color:var(--text-dim);margin-bottom:10px}
.stop-note b{color:var(--text)}

/* 양성 / 음성 버튼 */
.pn{display:flex;gap:8px}
.pn button{
  flex:1;padding:11px 10px;border-radius:10px;font-size:14.5px;font-weight:800;
  border:1.5px solid var(--paper-line);background:#fff;color:var(--text-dim);transition:all .12s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.pn button:hover{border-color:#b9c4d2;color:var(--text)}
.pn button.pos.on{background:var(--red);border-color:var(--red);color:#fff}
.pn button.neg.on{background:var(--green);border-color:var(--green);color:#fff}
.pn.pv-on button{flex-direction:column;gap:1px;padding:9px 10px}
.pn .pv{display:block;font-size:11.5px;font-weight:700;opacity:.72;font-variant-numeric:tabular-nums}
.pn button.on .pv{opacity:.9}
.pn.small{flex-shrink:0;gap:5px}
.pn.small button{flex:none;width:58px;padding:7px 0;font-size:12.5px;border-radius:8px}

/* 검사 목록 */
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--paper-line)}
.row:first-of-type{border-top:none;padding-top:4px}
.row.is-next .r-name::after{content:"다음";font-size:10.5px;font-weight:800;color:var(--yellow-ink);background:var(--yellow);padding:1px 6px;border-radius:4px;margin-left:7px;vertical-align:2px}
.row.muted{opacity:.5}
.r-idx{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:var(--slate-soft);color:var(--text-dim);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.row.done .r-idx{background:var(--navy-900);color:var(--yellow)}
.r-main{flex:1;min-width:0}
.r-name{font-size:14.5px;font-weight:800;letter-spacing:-.01em;line-height:1.35}
.r-name .k{font-size:12px;font-weight:600;color:var(--text-dim);margin-left:5px}
.r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.r-meta b{color:var(--text);font-weight:700}
.r-src{color:var(--text-faint)}
.r-applied{margin-top:4px;font-size:12px;font-weight:700}
.r-applied.pos{color:var(--red-ink)}
.r-applied.neg{color:var(--green-ink)}
.r-applied.grey{color:var(--text-faint);font-weight:600}
.r-tip{margin-top:4px;font-size:11.5px;color:var(--text-faint)}
.badge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.01em;white-space:nowrap}
.b-out{background:var(--green-soft);color:var(--green-ink)}
.b-in{background:var(--orange-soft);color:var(--orange-ink)}
.b-both{background:var(--navy-900);color:var(--yellow)}
.b-aux{background:#e3edf8;color:#25567e}
.b-weak{background:var(--slate-soft);color:var(--text-faint)}
.b-na{background:var(--slate-soft);color:var(--text-faint)}
.b-co{background:#eee9f7;color:#5b4a86}

/* 양성 기준 · 전자책 영상 (v3) */
.next-head{display:flex;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.next-head .next-name{flex:1;min-width:0}
.pc{display:flex;gap:7px;align-items:flex-start;margin-top:5px;font-size:12.5px;line-height:1.5;color:#34424f}
.pc-tag{flex-shrink:0;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--slate-soft);color:var(--text-dim);margin-top:1px;white-space:nowrap}
.pc.big{margin-top:10px;padding:9px 11px;border-radius:9px;background:#fff;border:1px solid #efdca0;font-size:14px;font-weight:600;color:var(--text)}
.pc.big .pc-tag{background:var(--navy-900);color:var(--yellow);margin-top:2px}
.r-top{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.vid{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--navy-900);background:#e7ecf3;border:1px solid #d5dde8;border-radius:100px;padding:2px 8px 2px 6px;text-decoration:none;white-space:nowrap;line-height:1.5;transition:all .12s}
.vid:hover{background:#dbe3ee;border-color:#b9c6d6}
.vid svg{width:11px;height:11px;flex-shrink:0}
.vid small{font-size:10.5px;font-weight:700;color:var(--text-dim)}
.vid.big{font-size:12.5px;padding:6px 12px 6px 10px;gap:6px;background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.vid.big:hover{background:var(--navy-700)}
.vid.big svg{width:14px;height:14px;color:var(--yellow)}
.vid.big small{color:var(--ink-dim)}
.vid.off{color:var(--text-dim);background:var(--slate-soft);border-color:var(--paper-line);font-weight:700}
.tbl .t-pc{display:block;font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.5}

/* 클러스터 */
.cl-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cl-dots{display:flex;gap:4px}
.cl-dots i{width:18px;height:6px;border-radius:3px;background:var(--slate-soft)}
.cl-dots i.p{background:var(--red)}
.cl-dots i.n{background:var(--green)}
.cl-text{font-size:13.5px;font-weight:700}
.cl-sub{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.55}

/* 감별 */
.ddx{display:flex;flex-wrap:wrap;gap:7px}
.ddx button{
  font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:100px;
  border:1px solid var(--paper-line);background:var(--paper);color:var(--text);transition:all .12s;
  display:flex;align-items:center;gap:6px;
}
.ddx button:hover{border-color:var(--navy-900)}
.ddx button .pbadge{background:var(--slate-soft);color:var(--text-dim)}
.ddx button .pbadge.z-out{background:var(--green-soft);color:var(--green-ink)}
.ddx button .pbadge.z-in{background:var(--red-soft);color:var(--red-ink)}
.ddx button .pbadge.z-high{background:var(--orange-soft);color:var(--orange-ink)}

.note{font-size:13px;color:#3a4759;line-height:1.65}
.note-src{margin-top:10px;font-size:11.5px;color:var(--text-faint);line-height:1.55}
.link-btn{font-size:12.5px;font-weight:700;color:var(--text-dim);text-decoration:underline;text-underline-offset:3px;margin-top:10px}
.link-btn:hover{color:var(--text)}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(10,15,24,.6);z-index:90;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal-card{width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;background:var(--paper-card);color:var(--text);border-radius:var(--radius);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--paper-line)}
.modal-head h3{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.modal-head button{margin-left:auto;font-size:22px;color:var(--text-dim);line-height:1;padding:0 4px}
.modal-body{padding:18px 20px 22px;overflow-y:auto;font-size:13.5px;line-height:1.65;color:#2a3646}
.modal-body h4{font-size:14px;font-weight:800;color:var(--text);margin:18px 0 8px;display:flex;align-items:center;gap:7px}
.modal-body h4:first-child{margin-top:0}
.modal-body h4::before{content:"";width:8px;height:8px;background:var(--yellow)}
.modal-body p{margin-bottom:9px}
.modal-body ul{padding-left:18px;margin-bottom:10px}
.modal-body li{margin-bottom:4px}
.modal-body li::marker{color:var(--yellow-deep)}
.modal-body b{color:var(--text)}
.tbl-wrap{overflow-x:auto;margin-bottom:12px;border:1px solid var(--paper-line);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.tbl th{background:var(--navy-900);color:var(--ink);font-weight:700;padding:7px 10px;text-align:left;white-space:nowrap}
.tbl td{padding:7px 10px;border-top:1px solid var(--paper-line);vertical-align:top;font-variant-numeric:tabular-nums}
.tbl td.num{text-align:right;white-space:nowrap}
.tbl tr.grp td{background:var(--slate-soft);font-weight:800;color:var(--text)}
.tbl .t-k{display:block;font-size:11.5px;color:var(--text-faint)}
.refs{font-size:12px;color:var(--text-dim);line-height:1.6}
.refs li{margin-bottom:5px}
.lr-table td:first-child{font-weight:700}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--navy-900);color:var(--ink);font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;transition:all .2s;z-index:120}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.foot-note{text-align:center;font-size:11px;color:var(--text-faint);margin-top:18px;line-height:1.6}

/* ============ 모바일 ============ */
@media (max-width:900px){
  #side{
    position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-100%);
    transition:transform .25s ease;width:min(320px,88vw);
  }
  #side.open{transform:translateX(0);box-shadow:20px 0 60px rgba(0,0,0,.4)}
  #sideDim{display:none;position:fixed;inset:0;background:rgba(10,15,24,.55);z-index:49}
  #sideDim.show{display:block}
  #mobileToggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--paper-line);flex-shrink:0}
  #mobileToggle svg{width:17px;height:17px;stroke:var(--text)}
  .top{padding:0 12px;gap:8px}
  .tbtn .t-txt{display:none}
  .tbtn{padding:7px 9px}
  #inner{padding:16px 14px 50px}
  .region-grid{grid-template-columns:repeat(2,1fr)}
  .rule-grid{grid-template-columns:1fr}
  .home-hero h2{font-size:21px}
  .prob-num{font-size:34px}
  .card{padding:15px 15px}
  .seg{margin-left:0;width:100%}
  .seg button{flex:1;padding:7px 4px}
  .row{flex-wrap:wrap;gap:8px 10px}
  .row .pn.small{width:100%;padding-left:32px}
  .row .pn.small button{flex:1;width:auto}
}
@media (max-width:420px){
  .top-sub{display:none}
  .prob-top{flex-wrap:wrap}
  .prob-top .pt-right{margin-left:0;text-align:left;width:100%}
}

/* ============ 인쇄 ============ */
@media print{
  body{background:#fff}
  #side,#sideDim,.top-actions,#mobileToggle,#backBtn,.pn,.next,.modal,#toast,.vid{display:none !important}
  #app{display:block;height:auto}
  #mainCol{display:block}
  #scroll{overflow:visible}
  #inner{max-width:none;padding:0}
  .card{break-inside:avoid;border-color:#ccc}
}

/* 공개판 표시 */
.ver-tag{font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--yellow);white-space:nowrap;
  border:1px solid rgba(255,212,77,.42);border-radius:999px;padding:0 7px;line-height:17px;transform:translateY(-2px)}

</style>
</head>

/* 개수 기반 클러스터 규칙 — 남은 항목 결과와 무관하게 구간이 확정될 때만 LR 적용 */
function countRule(items, bands){
  return function(res){
    let pos=0, neg=0, unk=0;
    items.forEach(id=>{ if(res[id]==='+') pos++; else if(res[id]==='-') neg++; else unk++; });
    const pick = c => bands.findIndex(b => (b.min==null || c>=b.min) && (b.max==null || c<=b.max));
    const first = pick(pos);
    let same = true;
    for(let c=pos; c<=pos+unk; c++){ if(pick(c)!==first){ same=false; break; } }
    const band = first>=0 ? bands[first] : null;
    return {
      pos, neg, unk, n: items.length,
      done: same,
      lr: (same && band) ? band.lr : null,
      t: !same ? '판정 대기' : (band ? band.t : '규칙 구간 밖 — 개별 검사 LR 적용')
    };
  };
}

  ],

{ id:'an-at', r:'an', g:'아킬레스 · 발뒤꿈치 통증', n:'아킬레스 건병증', en:'Achilles tendinopathy',
  cue:'아침 첫걸음 아킬레스 통증·뻣뻣함 · 부착부 2–6 cm 위 통증',

  ],

  refs:['reiman14'] },

{ id:'an-pf', r:'an', g:'아킬레스 · 발뒤꿈치 통증', n:'족저근막염', en:'Plantar fasciitis',
  cue:'아침 첫발 발뒤꿈치 안쪽 통증 · 오래 앉았다 일어설 때 통증',
  tests:[
    {id:'wl',  n:'Windlass (체중 부하)', k:'윈드라스', sn:.318, sp:1.00, s:'De Garceau 2003', tip:'비체중 부하 시 민감도 13.6%', pc:"선 자세에서 엄지발가락을 수동 신전할 때 평소 발뒤꿈치 통증 재현"}
  ],
  ddx:['an-at'],
  note:'양성이면 확진 쪽으로 강하지만(특이도 100% → 계산 97%) 음성으로 배제는 불가합니다. 진단은 병력(첫발 통증) + 내측 종골결절 압통이 중심입니다.',
  refs:['degarceau03'] },

{ id:'an-mn', r:'an', g:'앞발 통증', n:'지간 신경종 (Morton)', en:"Morton's neuroma",
  cue:'3·4번째 발가락 사이 화끈거림·저림 · 좁은 신발에서 악화',
  tests:[
    {id:'tif', n:'Thumb-index finger squeeze', k:'엄지-검지 지간 압박', sn:.96, sp:1.00, lrp:null, lrn:.04, s:'Mahadevan (Pitcher 2024 인용)', tip:'특이도 100%는 신경종이 아닌 1명에서 계산된 값 — 양성 결과는 확률에 반영하지 않음', pc:"엄지 바닥·검지로 해당 지간을 위아래로 압박할 때 압통 (옆으로 쥐어짜지 않음)"},
    {id:'mul', n:"Mulder's click", k:'멀더 징후', sn:.29, sp:.87, s:'Dando (Pitcher 2024 인용)', tip:'연구 간 편차 큼 (다른 연구 64/100, 94/17)', pc:"중족골두를 옆에서 쥐어짤 때 딸깍이 만져짐 (통증 동반 가능)"}
  ],
  ddx:['an-pf'],
  note:'엄지-검지 압박 검사 음성이면 배제력이 큽니다(LR− 0.04). 모두 소규모 초음파 기준 연구입니다.',
  refs:['pitcher24'] }
];

</script>
<script>
'use strict';

/* ═══════════════ 계산 ═══════════════ */
const CAP = 0.97;              /* 100%로 보고된 값은 97%로 보정 */
const PRE_LABELS = ['낮음','중간','높음'];
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CAT = {};
const REG = {};
REGIONS.forEach(r => { REG[r.id] = r; });
CATS.forEach(c => {
  CAT[c.id] = c;
  c.pre = c.pre || [.25,.50,.75];
  c.ro  = c.ro  != null ? c.ro : .10;
  c.ri  = c.ri  != null ? c.ri : .90;
  c.T = {};
  c.tests.forEach(t => { c.T[t.id] = t; });
});

function eff(v){ return v >= 0.995 ? CAP : v; }
function LRp(t){
  if(t.co || t.nolr) return null;
  if('lrp' in t) return t.lrp;
  if(t.sn == null || t.sp == null) return null;
  return eff(t.sn) / (1 - eff(t.sp));
}
function LRn(t){
  if(t.co || t.nolr) return null;
  if('lrn' in t) return t.lrn;
  if(t.sn == null || t.sp == null) return null;
  return (1 - eff(t.sn)) / eff(t.sp);
}
function role(t){
  if(t.co) return 'co';
  if(t.nolr) return 'na';
  const p = LRp(t), n = LRn(t);
  const o = n != null && n <= 0.3, i = p != null && p >= 5;
  if(o && i) return 'both';
  if(o) return 'out';
  if(i) return 'in';
  if((p != null && p >= 2) || (n != null && n <= 0.5)) return 'aux';
  return 'weak';
}
const ROLE_TXT = {both:'배제·확진', out:'배제용 · SnNout', in:'확진용 · SpPin', aux:'보조', weak:'판별력 약함', na:'근거 부족 · 계산 제외', co:'클러스터 항목'};

/* 양성 기준 · 전자책 영상 (v3) */
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';
function ytURL(v){ return 'https://www.youtube.com/watch?v=' + encodeURIComponent(v); }
function ebLink(t, big){
  if(!t.eb) return '';
  const pg = 'P.' + t.eb.p;
  if(!t.eb.v) return '<span class="vid off' + (big ? ' big' : '') + '" title="전자책 ' + t.eb.p + '쪽">전자책 ' + pg + '</span>';
  return '<a class="vid' + (big ? ' big' : '') + '" href="' + ytURL(t.eb.v) + '" target="_blank" rel="noopener noreferrer" title="전자책 ' + t.eb.p + '쪽 검사 영상 (유튜브 · 인터넷 필요)">' +
    PLAY + '<span>' + (big ? '방법 영상' : '영상') + '</span><small>' + (big ? '전자책 ' : '') + pg + '</small></a>';
}
function pcLine(t, big){
  if(!t.pc) return '';
  return '<div class="pc' + (big ? ' big' : '') + '"><span class="pc-tag">양성 기준</span><span class="pc-txt">' + esc(t.pc) + '</span></div>';
}

function fmtLR(v){
  if(v == null) return '—';
  if(v >= 100) return Math.round(v).toString();
  if(v >= 10) return v.toFixed(1).replace(/\.0$/,'');
  if(v >= 1) return v.toFixed(1);
  return v.toFixed(2);
}
function pct(p){
  if(p < 0.01) return (p*100 < 0.1 ? '<0.1' : (p*100).toFixed(1)) + '%';
  if(p > 0.99) return '>99%';
  return Math.round(p*100) + '%';
}
function pctRaw(v){ return v == null ? '—' : Math.round(v*100) + '%'; }

/* ═══════════════ 세션 ═══════════════ */
const S = {};
function sess(id){ return S[id] || (S[id] = {pre:1, res:{}, seq:[]}); }

function evaluate(cat){
  const st = sess(cat.id);
  const p0 = cat.pre[st.pre];
  let odds = p0 / (1 - p0);
  const steps = [];
  let cl = null, clLR = null;
  if(cat.cl){
    cl = cat.cl.rule(st.res);
    if(cl.lr != null) clLR = cl.lr;
  }
  const inCl = id => !!(cat.cl && cat.cl.items.indexOf(id) >= 0);
  st.seq.forEach(id => {
    const t = cat.T[id], r = st.res[id];
    if(!t || !r) return;
    if(inCl(id) && clLR != null){ steps.push({id, r, lr:null, how:'cl'}); return; }
    if(t.co){ steps.push({id, r, lr:null, how:'co'}); return; }
    if(t.nolr){ steps.push({id, r, lr:null, how:'na'}); return; }
    const lr = r === '+' ? LRp(t) : LRn(t);
    if(lr == null){ steps.push({id, r, lr:null, how:'nolr'}); return; }
    odds *= lr;
    steps.push({id, r, lr, how:'ind'});
  });
  if(clLR != null) odds *= clLR;
  let p = odds / (1 + odds);
  p = Math.min(Math.max(p, 0.0005), 0.9995);
  const applied = steps.filter(s => s.how === 'ind').length + (clLR != null ? 1 : 0);
  return {p0, p, steps, cl, clLR, n: st.seq.length, applied};
}

const ZONE = {
  none:   {lab:'검사 전',     cls:'z-none', msg:'문진으로 사전확률을 고른 뒤, 아래 추천 검사부터 시행하세요.'},
  pending:{lab:'판정 대기',   cls:'z-mid',  msg:'클러스터 항목을 더 확인하면 확률이 계산됩니다.'},
  out:    {lab:'배제 가능',   cls:'z-out',  msg:'이 진단의 가능성은 낮습니다. 아래 감별 진단으로 넘어가세요.'},
  low:    {lab:'가능성 낮음', cls:'z-low',  msg:'배제 기준까지 조금 남았습니다. 배제력 있는(LR− 낮은) 검사를 더 하거나 다른 감별로 넘어가세요.'},
  mid:    {lab:'불확실',      cls:'z-mid',  msg:'아직 결론을 내리기 어렵습니다. 추가 검사가 필요합니다.'},
  high:   {lab:'가능성 높음', cls:'z-high', msg:'확진용(특이도 높은) 검사로 확인하세요.'},
  in:     {lab:'강하게 시사', cls:'z-in',   msg:'추가 검사보다 치료 계획·의뢰를 판단할 단계입니다. 다른 소견과 함께 종합하세요.'},
  noinfo: {lab:'계산 없음',   cls:'z-mid',  msg:'기록한 결과에는 확률에 반영할 근거(우도비)가 없습니다. 근거가 있는 다른 검사로 판단하세요.'},
  redout: {lab:'위험 신호 배제', cls:'z-out', msg:'위험 신호 가능성이 매우 낮습니다. 영상검사 없이 진행할 수 있는 수준입니다.'},
  red:    {lab:'배제 안 됨',  cls:'z-in',   msg:'위험 신호를 배제하지 못했습니다 → 영상검사 또는 전문의 의뢰를 권합니다.'}
};
function zoneOf(cat, ev){
  if(!ev.n) return 'none';
  if(!ev.applied) return (ev.cl && !ev.cl.done) ? 'pending' : 'noinfo';
  const p = ev.p;
  if(p <= cat.ro) return cat.red ? 'redout' : 'out';
  if(cat.red) return 'red';
  if(p < 0.30) return 'low';
  if(p < 0.70) return 'mid';
  if(p < cat.ri) return 'high';
  return 'in';
}

function nextTest(cat, ev){
  const st = sess(cat.id);
  const clDone = !!(ev.cl && ev.cl.done);
  const inCl = id => !!(cat.cl && cat.cl.items.indexOf(id) >= 0);
  const rem = cat.tests.filter(t => !st.res[t.id] && !(clDone && inCl(t.id)));
  if(!rem.length) return null;
  const z = zoneOf(cat, ev);
  const stop = ['out','redout','in'].indexOf(z) >= 0;
  let pick = null, why = '';
  if(!st.seq.length){
    pick = rem[0];
    why = (cat.cl && cat.cl.prio && inCl(pick.id)) ? cat.cl.n + ' 항목부터 시작합니다.' : '이 증상에서 먼저 권장되는 검사입니다.';
  }else if(cat.cl && cat.cl.prio && ev.cl && !ev.cl.done){
    pick = rem.find(t => inCl(t.id)) || null;
    if(pick) why = cat.cl.n + ' 판정을 위한 다음 항목입니다.';
  }
  if(!pick){
    const withLR = rem.filter(t => !t.co && !t.nolr && (LRp(t) != null || LRn(t) != null));
    if(withLR.length){
      if(ev.p < 0.5){
        let best = null, bv = Infinity;
        withLR.forEach(t => { const v = LRn(t); if(v != null && v < bv){ bv = v; best = t; } });
        if(best && bv < 0.8){ pick = best; why = '가능성이 낮은 쪽 → 배제력이 가장 큰 검사 (LR− ' + fmtLR(bv) + ')'; }
      }
      if(!pick){
        let best = null, bv = -1;
        withLR.forEach(t => { const v = LRp(t); if(v != null && v > bv){ bv = v; best = t; } });
        if(best){ pick = best; why = (ev.p >= 0.5 ? '가능성이 높은 쪽 → 확진력이 가장 큰 검사' : '남은 검사 중 확진력이 가장 큰 검사') + ' (LR+ ' + fmtLR(bv) + ')'; }
      }
    }
  }
  if(!pick){ pick = rem[0]; why = pick.co ? '남은 클러스터 항목입니다.' : '남은 검사입니다.'; }
  return {t:pick, why, stop, zone:z};
}

/* 이 검사를 양성/음성으로 기록하면 확률이 어떻게 바뀌는지 미리 계산 */
function preview(cat, tid){
  const st = sess(cat.id);
  const saveRes = Object.assign({}, st.res), saveSeq = st.seq.slice();
  const out = {};
  ['+','-'].forEach(r => {
    st.res = Object.assign({}, saveRes);
    st.seq = saveSeq.filter(x => x !== tid);
    st.res[tid] = r; st.seq.push(tid);
    const ev = evaluate(cat);
    const before = evaluate0(cat, saveRes, saveSeq);
    out[r] = {p: ev.p, same: Math.abs(ev.p - before) < 0.0005, z: zoneOf(cat, ev)};
  });
  st.res = saveRes; st.seq = saveSeq;
  return out;
}
function evaluate0(cat, res, seq){
  const st = sess(cat.id);
  const r0 = st.res, s0 = st.seq;
  st.res = res; st.seq = seq;
  const p = evaluate(cat).p;
  st.res = r0; st.seq = s0;
  return p;
}

/* ═══════════════ 상태 ═══════════════ */
let view = 'home';
let curRegion = 'sh';
let curCat = null;

const side = $('side'), sideDim = $('sideDim'), inner = $('inner'), scrollEl = $('scroll');
const topTitle = $('topTitle'), topSub = $('topSub'), backBtn = $('backBtn');
const topActions = $('topActions');

function catsOf(rid){ return CATS.filter(c => c.r === rid); }
function groupsOf(rid){
  const out = [];
  catsOf(rid).forEach(c => {
    let g = out.find(x => x.n === c.g);
    if(!g){ g = {n:c.g, cats:[]}; out.push(g); }
    g.cats.push(c);
  });
  return out;
}
function statusBadge(cat){
  const st = S[cat.id];
  if(!st || !st.seq.length) return '';
  const ev = evaluate(cat);
  const z = zoneOf(cat, ev);
  if(z === 'pending' || z === 'noinfo') return '<span class="pbadge z-mid">' + (z === 'pending' ? '대기' : '기록') + '</span>';
  const cls = (z === 'redout') ? 'z-out' : (z === 'red') ? 'z-in' : ZONE[z].cls;
  return '<span class="pbadge ' + cls + '">' + pct(ev.p) + '</span>';
}

/* ═══════════════ 사이드바 ═══════════════ */
function renderRegionGrid(){
  $('regionGrid').innerHTML = REGIONS.map(r => {
    const tested = catsOf(r.id).some(c => S[c.id] && S[c.id].seq.length);
    return '<button type="button" class="rg-btn' + (r.id === curRegion ? ' on' : '') + '" data-region="' + r.id + '">' +
      esc(r.n) + (tested ? '<span class="rg-dot" title="검사 기록 있음"></span>' : '') + '</button>';
  }).join('');
}
function renderSideCats(){
  const html = groupsOf(curRegion).map(g =>
    '<div class="sc-group"><div class="sc-gname">' + esc(g.n) + '</div>' +
    g.cats.map(c =>
      '<button type="button" class="sc-item' + (c.id === curCat ? ' on' : '') + '" data-cat="' + c.id + '">' +
        '<span class="sc-text"><span class="sc-name">' + esc(c.n) + (c.red ? '<span class="sc-red">위험신호</span>' : '') + '</span>' +
        '<span class="sc-cue">' + esc(c.cue) + '</span></span>' + statusBadge(c) +
      '</button>'
    ).join('') + '</div>'
  ).join('');
  $('sideCats').innerHTML = html;
}
function renderSide(){ renderRegionGrid(); renderSideCats(); }

/* ═══════════════ 화면: 홈 ═══════════════ */
function renderHome(){
  view = 'home'; curCat = null;
  topTitle.textContent = '스페셜 테스트 내비';
  topSub.textContent = '부위를 고르면 증상별 검사 순서를 안내합니다';
  backBtn.style.display = 'none';
  topActions.style.visibility = 'hidden';
  const total = CATS.length;
  const nTests = CATS.reduce((a,c) => a + c.tests.length, 0);
  const nVid = CATS.reduce((a,c) => a + c.tests.filter(t => t.eb && t.eb.v).length, 0);
  inner.innerHTML =
    '<div class="home-hero"><div class="e-mark"></div>' +
      '<h2>검사 전에 먼저 정하세요<br>무엇을 배제하고, 무엇을 확인할지</h2>' +
      '<p>문진으로 의심 부위와 증상을 고르면 민감도·특이도 근거에 따라 검사 순서를 추천하고, 양성/음성 결과마다 가능성(사후확률)을 다시 계산합니다.</p>' +
    '</div>' +
    '<div class="rule-grid">' +
      '<div class="rule out"><span class="rule-tag">SnNout · 배제</span><h3>민감도 높은 검사가 <b>음성</b>이면 → 배제</h3>' +
        '<p>민감도가 높다 = 질환이 있으면 거의 다 양성. 그런데도 음성이면 질환이 없을 가능성이 높습니다.</p></div>' +
      '<div class="rule in"><span class="rule-tag">SpPin · 확진</span><h3>특이도 높은 검사가 <b>양성</b>이면 → 확진 쪽</h3>' +
        '<p>특이도가 높다 = 질환이 없으면 거의 다 음성. 그런데도 양성이면 질환이 있을 가능성이 높습니다.</p></div>' +
    '</div>' +
    '<div class="home-sec">부위 선택</div>' +
    '<div class="region-grid">' + REGIONS.map(r =>
      '<button type="button" class="region-card" data-region="' + r.id + '"><span class="rc-n">' + esc(r.n) + '</span>' +
      '<span class="rc-en">' + esc(r.en) + '</span><span class="rc-c">증상 분류 ' + catsOf(r.id).length + '개</span></button>'
    ).join('') + '</div>' +
    '<div class="card"><div class="card-label">사용 순서</div><div class="steps">' +
      '<div class="step"><div class="step-num">1</div><div>부위 → 증상 분류 선택 <span>— 문진에서 들은 증상과 가장 가까운 것</span></div></div>' +
      '<div class="step"><div class="step-num">2</div><div>사전확률(낮음·중간·높음) 선택 <span>— 병력으로 판단한 의심 정도</span></div></div>' +
      '<div class="step"><div class="step-num">3</div><div>추천 검사를 양성 기준대로 판정해 체크 <span>— 방법은 ▶ 영상, 결과에 따라 다음 검사가 바뀝니다</span></div></div>' +
      '<div class="step"><div class="step-num">4</div><div>배제되면 감별 진단으로 이동 <span>— 기록 복사로 차트에 붙여넣기</span></div></div>' +
    '</div></div>' +
    '<div class="foot-note">' + REGIONS.length + '개 부위 · ' + total + '개 증상 분류 · ' + nTests + '개 검사 항목 · 전자책 영상 연결 ' + nVid + '개<br>정확도 연구(민감도·특이도 또는 우도비)가 있는 검사만 수록했습니다.<br>검사 방법은 각 검사의 ▶ 영상(전자책 영상)에서 확인하세요.</div>';
  renderSide();
  scrollEl.scrollTop = 0;
}

/* ═══════════════ 화면: 검사 세션 ═══════════════ */
function testMeta(t, cat){
  const parts = [];
  const rl = role(t);
  parts.push('<span class="badge b-' + rl + '">' + ROLE_TXT[rl] + '</span>');
  if(t.co){
    parts.push('<span>단독 우도비 없음 — 클러스터 판정에만 사용</span>');
    if(cat && cat.cl) parts.push('<span class="r-src">' + esc(cat.cl.s) + ' 클러스터</span>');
  }else{
    if(t.sn != null) parts.push('<span>민감도 <b>' + pctRaw(t.sn) + '</b></span>');
    if(t.sp != null) parts.push('<span>특이도 <b>' + pctRaw(t.sp) + '</b></span>');
    if(!t.nolr){
      parts.push('<span>LR+ <b>' + fmtLR(LRp(t)) + '</b> · LR− <b>' + fmtLR(LRn(t)) + '</b></span>');
    }
    if(t.s) parts.push('<span class="r-src">' + esc(t.s) + '</span>');
  }
  return parts.join('');
}
function pnButtons(id, r, small, pv){
  const tail = k => {
    if(!pv) return '';
    const x = pv[k];
    return '<span class="pv">' + (x.same ? '확률 변화 없음' : '→ ' + pct(x.p)) + '</span>';
  };
  return '<div class="pn' + (small ? ' small' : '') + (pv ? ' pv-on' : '') + '">' +
    '<button type="button" class="pos' + (r === '+' ? ' on' : '') + '" data-test="' + id + '" data-r="+" aria-pressed="' + (r === '+') + '"><span>양성' + (small ? '' : ' (+)') + '</span>' + tail('+') + '</button>' +
    '<button type="button" class="neg' + (r === '-' ? ' on' : '') + '" data-test="' + id + '" data-r="-" aria-pressed="' + (r === '-') + '"><span>음성' + (small ? '' : ' (−)') + '</span>' + tail('-') + '</button>' +
  '</div>';
}
function gaugeHTML(cat, ev){
  const p = ev.p * 100, p0 = ev.p0 * 100;
  const ro = cat.ro * 100, ri = cat.red ? 100 : cat.ri * 100;
  return '<div class="gauge">' +
      '<div class="g-zone g-out" style="width:' + Math.max(ro, .8) + '%"></div>' +
      (cat.red ? '' : '<div class="g-zone g-in" style="width:' + (100 - ri) + '%"></div>') +
      '<div class="g-fill" style="width:' + p + '%"></div>' +
      '<div class="g-pre" style="left:' + p0 + '%" title="사전확률"></div>' +
      '<div class="g-needle" style="left:' + p + '%"></div>' +
    '</div>' +
    '<div class="g-scale"><span>0%</span><span>배제 ≤' + (cat.ro * 100 < 1 ? (cat.ro * 100).toFixed(1) : Math.round(cat.ro * 100)) + '%' +
      (cat.red ? '' : ' · 확진 ≥' + Math.round(cat.ri * 100) + '%') + '</span><span>100%</span></div>';
}

function renderSession(cid){
  if(cid){ curCat = cid; curRegion = CAT[cid].r; }
  view = 'cat';
  const cat = CAT[curCat];
  const st = sess(cat.id);
  const ev = evaluate(cat);
  const z = zoneOf(cat, ev);
  const zi = ZONE[z];
  const nx = nextTest(cat, ev);

  topTitle.textContent = cat.n;
  topSub.textContent = REG[cat.r].n + ' · ' + cat.en;
  backBtn.style.display = 'flex';
  topActions.style.visibility = 'visible';

  /* 헤더 */
  let h = '<div class="card"><div class="s-cue"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span>' + esc(cat.cue) + '</span></div>' +
    '<div class="pre-row"><div class="pre-lab">사전확률<small>문진으로 판단한 의심 정도</small></div><div class="seg" role="group" aria-label="사전확률">' +
    cat.pre.map((v,i) => '<button type="button" data-pre="' + i + '" class="' + (st.pre === i ? 'on' : '') + '">' + PRE_LABELS[i] + ' ' + pct(v) + '</button>').join('') +
    '</div></div></div>';

  /* 확률 */
  const applied = ev.steps.filter(s => s.how === 'ind').length;
  h += '<div class="card prob"><div class="prob-top"><div class="prob-num">' + pct(ev.p) + '</div>' +
    '<div class="prob-lab ' + zi.cls + '">' + zi.lab + '</div>' +
    '<div class="pt-right">사전 <b>' + pct(ev.p0) + '</b> → 사후 <b>' + pct(ev.p) + '</b><br>시행 ' + ev.n + '개 · 반영 ' + (applied + (ev.clLR != null ? 1 : 0)) + '건' + (ev.clLR != null ? ' (클러스터 포함)' : '') + '</div></div>' +
    gaugeHTML(cat, ev) +
    '<div class="prob-msg ' + zi.cls + '"><span class="dot"></span><span>' + esc(zi.msg) + '</span></div></div>';

  /* 다음 추천 */
  if(nx){
    const t = nx.t;
    if(nx.stop){
      h += '<div class="card next stop"><div class="card-label">추가로 확인하려면</div>' +
        '<div class="stop-note">현재 결과로 <b>' + zi.lab + '</b> 판단이 가능해 검사 종료를 권합니다. 더 확인하고 싶다면:</div>';
    }else{
      h += '<div class="card next"><div class="card-label">다음 추천 검사</div>';
    }
    h += '<div class="next-head"><div class="next-name">' + esc(t.n) + '<span class="k">' + esc(t.k || '') + '</span></div>' + ebLink(t, true) + '</div>' +
      (nx.stop ? '' : '<div class="next-why">' + esc(nx.why) + '</div>') +
      pcLine(t, true) +
      '<div class="next-meta">' + testMeta(t, cat) + '</div>' +
      (t.tip ? '<div class="next-tip">' + esc(t.tip) + '</div>' : '') +
      pnButtons(t.id, st.res[t.id], false, preview(cat, t.id)) + '</div>';
  }else{
    h += '<div class="card next stop"><div class="card-label">검사 완료</div><div class="stop-note">이 분류의 검사를 모두 기록했습니다. 결과는 위 확률과 아래 감별 진단을 참고해 종합하세요.</div></div>';
  }

  /* 클러스터 */
  if(cat.cl){
    const c = ev.cl;
    const dots = cat.cl.items.map(id => '<i class="' + (st.res[id] === '+' ? 'p' : st.res[id] === '-' ? 'n' : '') + '"></i>').join('');
    let sub;
    if(c.done && c.lr != null) sub = '규칙이 확정되어 해당 항목의 개별 LR 대신 클러스터 LR ' + fmtLR(c.lr) + '을 적용했습니다 (검사 간 중복 반영 방지).';
    else if(c.done) sub = '클러스터 규칙 구간에 해당하지 않아 각 검사의 개별 LR을 적용했습니다.';
    else if(c.lr != null) sub = '잠정 판정입니다 — 남은 항목을 확인하면 확정됩니다.';
    else sub = '항목을 모두(또는 판정이 확정될 만큼) 확인하면 연구에서 검증된 조합 LR이 적용됩니다. 그 전까지는 개별 LR로 계산합니다.';
    h += '<div class="card"><div class="card-label">' + esc(cat.cl.n) + '<span class="cl-right">' + esc(cat.cl.s) + '</span></div>' +
      '<div class="cl-status"><div class="cl-dots">' + dots + '</div><div class="cl-text">' + esc(c.t) + '</div></div>' +
      '<div class="cl-sub">' + esc(sub) + '</div></div>';
  }

  /* 전체 검사 목록 */
  const clDone = !!(ev.cl && ev.cl.done);
  h += '<div class="card"><div class="card-label">검사 목록<span class="cl-right">탭해서 결과 기록 · 다시 누르면 취소</span></div>';
  cat.tests.forEach((t, i) => {
    const r = st.res[t.id];
    const s = ev.steps.find(x => x.id === t.id);
    const isNext = nx && !nx.stop && nx.t.id === t.id;
    const inCl = cat.cl && cat.cl.items.indexOf(t.id) >= 0;
    const muted = !r && clDone && inCl;
    let applied = '';
    if(r && s){
      if(s.how === 'ind') applied = '<div class="r-applied ' + (r === '+' ? 'pos' : 'neg') + '">' + (r === '+' ? '양성' : '음성') + ' → LR ' + fmtLR(s.lr) + ' 반영</div>';
      else if(s.how === 'cl') applied = '<div class="r-applied grey">' + (r === '+' ? '양성' : '음성') + ' → 클러스터 LR로 반영</div>';
      else if(s.how === 'co') applied = '<div class="r-applied grey">' + (r === '+' ? '양성' : '음성') + ' → 클러스터 판정 대기</div>';
      else if(s.how === 'na') applied = '<div class="r-applied grey">' + (r === '+' ? '양성' : '음성') + ' 기록 (근거 부족 — 계산 제외)</div>';
      else applied = '<div class="r-applied grey">' + (r === '+' ? '양성' : '음성') + ' → 보고된 우도비 없음, 확률 변화 없음</div>';
    }else if(muted){
      applied = '<div class="r-applied grey">클러스터가 이미 확정되어 결과에 영향 없음</div>';
    }
    h += '<div class="row' + (r ? ' done' : '') + (isNext ? ' is-next' : '') + (muted ? ' muted' : '') + '">' +
      '<div class="r-idx">' + (i + 1) + '</div>' +
      '<div class="r-main"><div class="r-top"><div class="r-name">' + esc(t.n) + '<span class="k">' + esc(t.k || '') + '</span></div>' + ebLink(t, false) + '</div>' +
      (isNext ? '' : pcLine(t, false)) +
      '<div class="r-meta">' + testMeta(t, cat) + '</div>' + (t.tip && !isNext ? '<div class="r-tip">' + esc(t.tip) + '</div>' : '') + applied + '</div>' +
      pnButtons(t.id, r, true) + '</div>';
  });
  h += '</div>';

  /* 감별 */
  if(cat.ddx && cat.ddx.length){
    h += '<div class="card"><div class="card-label">감별 고려<span class="cl-right">결과는 분류별로 유지됩니다</span></div><div class="ddx">' +
      cat.ddx.filter(id => CAT[id]).map(id => {
        const c = CAT[id];
        return '<button type="button" data-cat="' + id + '">' + (c.r !== cat.r ? esc(REG[c.r].n) + ' · ' : '') + esc(c.n) + statusBadge(c) + '</button>';
      }).join('') + '</div></div>';
  }

  /* 메모·근거 */
  h += '<div class="card"><div class="card-label">임상 메모</div><div class="note">' + esc(cat.note) + '</div>' +
    '<div class="note-src">출처: ' + cat.refs.map(k => esc((REFS[k] || '').split('.')[0])).join(' · ') + '</div>' +
    '<button type="button" class="link-btn" data-action="evidence">근거 자세히 보기</button></div>';

  h += '<div class="foot-note">사후확률 = 사전확률 × 우도비(검사 간 독립 가정). 상관된 검사를 여러 개 곱하면 과대평가될 수 있어<br>검증된 클러스터가 있으면 클러스터 LR을 우선 적용합니다. 임상 판단 보조용입니다.</div>';

  inner.innerHTML = h;
  renderSide();
}

/* ═══════════════ 결과 기록 ═══════════════ */
function setResult(tid, r){
  const cat = CAT[curCat];
  const st = sess(cat.id);
  if(st.res[tid] === r){
    delete st.res[tid];
    st.seq = st.seq.filter(x => x !== tid);
  }else{
    if(!st.res[tid]) st.seq.push(tid);
    st.res[tid] = r;
  }
  const keep = scrollEl.scrollTop;
  renderSession();
  scrollEl.scrollTop = keep;
}

/* ═══════════════ 기록 복사 ═══════════════ */
function recordText(){
  const d = new Date();
  const lines = ['[이학적 검사 기록] ' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')];
  let any = false;
  CATS.forEach(cat => {
    const st = S[cat.id];
    if(!st || !st.seq.length) return;
    any = true;
    const ev = evaluate(cat);
    const z = zoneOf(cat, ev);
    lines.push('');
    lines.push('■ ' + REG[cat.r].n + ' · ' + cat.n);
    lines.push('  사전확률 ' + pct(ev.p0) + ' (' + PRE_LABELS[st.pre] + ')');
    st.seq.forEach(id => {
      const t = cat.T[id], r = st.res[id];
      const s = ev.steps.find(x => x.id === id);
      lines.push('  · ' + t.n + ': ' + (r === '+' ? '양성' : '음성') + (s && s.lr != null ? ' (LR ' + fmtLR(s.lr) + ')' : ''));
    });
    if(cat.cl && ev.cl && ev.cl.lr != null) lines.push('  · ' + cat.cl.n + ': ' + ev.cl.t);
    lines.push('  → 사후확률 ' + pct(ev.p) + ' · ' + ZONE[z].lab);
  });
  if(!any) return '';
  lines.push('');
  lines.push('※ 민감도·특이도 기반 확률 추정(검사 간 독립 가정) — 임상 판단 보조용');
  return lines.join('\n');
}
async function copyRecord(){
  const txt = recordText();
  if(!txt){ toast('아직 기록된 검사 결과가 없습니다'); return; }
  let ok = false;
  try{ await navigator.clipboard.writeText(txt); ok = true; }catch(e){}
  if(!ok){
    try{
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    }catch(e){ ok = false; }
  }
  if(ok) toast('평가 기록을 복사했습니다 — 차트에 붙여넣으세요');
  else openModal('평가 기록', '<p>자동 복사가 막혀 있습니다. 아래 내용을 직접 복사해 주세요.</p><textarea style="width:100%;height:260px;font:12.5px/1.6 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--paper-line);border-radius:8px" readonly>' + esc(txt) + '</textarea>');
}
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

/* ═══════════════ 모달 ═══════════════ */
function openModal(title, html){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = html;
  $('modal').classList.add('show');
  $('modalBody').scrollTop = 0;
}
function closeModal(){ $('modal').classList.remove('show'); }

    '<tr><td>' + esc(t.n) + '<span class="t-k">' + esc(t.k || '') + '</span>' + (t.pc ? '<span class="t-pc">양성: ' + esc(t.pc) + '</span>' : '') + '</td>' +
    '<td class="num">' + (t.co ? '—' : pctRaw(t.sn)) + '</td><td class="num">' + (t.co ? '—' : pctRaw(t.sp)) + '</td>' +

    '<td>' + (t.co ? esc(cat.cl ? cat.cl.s : '') + ' 클러스터 항목' : esc(t.s || '')) + (t.nolr ? ' · 계산 제외' : '') + (t.eb ? '<span class="t-k">전자책 P.' + t.eb.p + '</span>' : '') + '</td></tr>'
  ).join('');
}
function showEvidence(cat){
  let h = '<h4>검사별 수치</h4><div class="tbl-wrap"><table class="tbl"><thead><tr><th>검사</th><th>민감도</th><th>특이도</th><th>LR+</th><th>LR−</th><th>출처</th></tr></thead><tbody>' +
    evidenceRows(cat) + '</tbody></table></div>';
  if(cat.cl){
    h += '<h4>' + esc(cat.cl.n) + '</h4><p>항목: ' + cat.cl.items.map(id => esc(cat.T[id].n)).join(', ') + '</p>';
  }
  h += '<h4>임상 메모</h4><p>' + esc(cat.note) + '</p>';
  h += '<h4>참고 문헌</h4><ul class="refs">' + cat.refs.map(k => '<li>' + esc(REFS[k] || k) + '</li>').join('') + '</ul>';
  h += '<h4>계산 규칙</h4><ul><li>LR+ = 민감도 ÷ (1 − 특이도), LR− = (1 − 민감도) ÷ 특이도. 원문이 우도비를 직접 보고한 경우 그 값을 사용했습니다.</li>' +
    '<li>100%로 보고된 민감도·특이도는 소표본 과대추정을 고려해 97%로 계산했습니다.</li>' +
    '<li>LR+ 5 이상이면 "확진용", LR− 0.3 이하이면 "배제용"으로 표시했습니다.</li></ul>';
  openModal(cat.n + ' · 근거', h);
}
function showAllEvidence(){
  let h = '<p>이 도구에 들어간 모든 검사의 수치와 출처입니다. 부위 → 증상 분류 순서로 정리했습니다.</p>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>검사</th><th>민감도</th><th>특이도</th><th>LR+</th><th>LR−</th><th>출처</th></tr></thead><tbody>';
  REGIONS.forEach(r => {
    catsOf(r.id).forEach(c => {
      h += '<tr class="grp"><td colspan="6">' + esc(r.n) + ' · ' + esc(c.n) + '</td></tr>' + evidenceRows(c);
    });
  });
  h += '</tbody></table></div><h4>참고 문헌</h4><ul class="refs">' +
    Object.keys(REFS).map(k => '<li>' + esc(REFS[k]) + '</li>').join('') + '</ul>';
  openModal('전체 근거표', h);
}

/* ═══════════════ 이벤트 ═══════════════ */
function closeSide(){ side.classList.remove('open'); sideDim.classList.remove('show'); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-test]');
  if(t){ setResult(t.dataset.test, t.dataset.r); return; }
  const pr = e.target.closest('[data-pre]');
  if(pr && view === 'cat'){ sess(curCat).pre = +pr.dataset.pre; renderSession(); return; }
  const rg = e.target.closest('[data-region]');
  if(rg){ renderRegion(rg.dataset.region); if(rg.classList.contains('region-card')) closeSide(); return; }
  const c = e.target.closest('[data-cat]');
  if(c){ renderSession(c.dataset.cat); scrollEl.scrollTop = 0; closeSide(); return; }
  const a = e.target.closest('[data-action="evidence"]');
  if(a && curCat){ showEvidence(CAT[curCat]); return; }
});
/* 사이드바의 부위 버튼은 메뉴를 열어 둔 채 목록만 바꾸고, 본문의 부위 카드는 메뉴를 닫습니다 */
$('brandHome').addEventListener('click', () => { renderHome(); closeSide(); });
$('brandHome').addEventListener('keydown', e => { if(e.key === 'Enter'){ renderHome(); closeSide(); } });
backBtn.addEventListener('click', () => { if(view === 'cat') renderRegion(); else renderHome(); });
$('evBtn').addEventListener('click', () => { if(curCat) showEvidence(CAT[curCat]); });
$('copyBtn').addEventListener('click', copyRecord);
$('resetBtn').addEventListener('click', () => {
  if(!curCat) return;
  const st = sess(curCat);
  if(!st.seq.length){ toast('초기화할 결과가 없습니다'); return; }
  st.res = {}; st.seq = [];
  renderSession(); toast('이 분류의 결과를 초기화했습니다');
});
/* 새 환자: 결과가 있으면 한 번 더 눌러야 지웁니다 (confirm() 창을 무시하는 앱 내 브라우저 대비) */
const NEWPT_LABEL = '새 환자 (전체 초기화)';
let newPtArmed = 0, newPtTimer = null;
function disarmNewPt(){ newPtArmed = 0; clearTimeout(newPtTimer); $('newPtBtn').textContent = NEWPT_LABEL; $('newPtBtn').classList.remove('armed'); }
$('newPtBtn').addEventListener('click', () => {
  const any = Object.keys(S).some(k => S[k].seq.length);
  if(any && !(newPtArmed && Date.now() - newPtArmed < 4000)){
    newPtArmed = Date.now();
    $('newPtBtn').textContent = '한 번 더 누르면 모두 지웁니다';
    $('newPtBtn').classList.add('armed');
    clearTimeout(newPtTimer); newPtTimer = setTimeout(disarmNewPt, 4000);
    return;
  }
  disarmNewPt();
  Object.keys(S).forEach(k => delete S[k]);
  renderHome(); closeSide(); toast('새 환자로 시작합니다');
});
$('helpBtn').addEventListener('click', () => { showHelp(); closeSide(); });
$('allEvBtn').addEventListener('click', () => { showAllEvidence(); closeSide(); });
$('modalClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if(e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
$('mobileToggle').addEventListener('click', () => { side.classList.add('open'); sideDim.classList.add('show'); });
sideDim.addEventListener('click', closeSide);

/* ═══════════════ 시작 ═══════════════ */
renderHome();

</script>
<script>
/* ═══════════════ 홈 화면 앱(설치) ═══════════════
   이 도구 전용 서비스워커를 이 페이지 범위로만 등록합니다 — 같은 사이트의 다른 도구와 범위·캐시가 겹치지 않습니다.
   https 주소(또는 내 컴퓨터 localhost)에서만 동작하고, 파일로 직접 열면 건너뜁니다. */
try{
  var secureHost = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if('serviceWorker' in navigator && secureHost && window.top === window.self){
    window.addEventListener('load', function(){
      try{ navigator.serviceWorker.register('special-test-navi-sw.js', {scope: './special-test-navi'}).catch(function(){}); }catch(e){}
    });
  }
}catch(e){}
</script>
